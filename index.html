<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>モールス信号変換ツール</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            padding: 0;
            background-image: url("https://t4.ftcdn.net/jpg/03/62/15/61/360_F_362156188_yZFBruW2nRClI9Dm4zmokdXsgrMKx11m.jpg");
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        .header2 {
            margin-top: 20px;
            font-size: 48px;
            color: #555;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            background-size: cover;
            background-repeat: no-repeat;
            padding: 10px;
        }
        .header2 img {
            width: 125px;
            height: 100px;
            margin-right: 30px;
        }
        label, input, textarea, button {
            display: block;
            margin-bottom: 10px;
        }
        textarea {
            width: 100%;
            height: 300px;
            background-color: rgba(255, 255, 255, 0.4); /* 半透明の背景色 */
            color: #000; /* 黒い文字色 */
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 10px;
            box-sizing: border-box;
        }
        #inputText, #result {
            font-size: 23px;
        }
        .footer {
            margin-top: 50px;
            font-size: 22px;
            color: #383737;
            text-align: center;
        }
        .Links {
            margin-top: 20px;
            font-size: 24px;
            color: #1b1b1b;
            text-align: center;
        }
        .footerLinks {
            margin-top: 10px;
            font-size: 18px;
            color: #16369c;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="header2">
        <img src="https://static.wikia.nocookie.net/logopedia/images/3/32/Hive_minigames_logo.png/revision/latest?cb=20240427131939" alt="Logo">
        モールス信号変換ツール
    </div>

    <form id="replaceForm">
        <label for="inputText">入力する文:</label>
        <textarea id="inputText" placeholder="ここに文を入力してください"></textarea>

        <button type="button" onclick="convertToMorse()">モールス信号に変換</button>
    </form>

    <h2>結果:</h2>
    <textarea id="result" readonly></textarea>
    <button type="button" onclick="copyResult()">コピーする</button>
    <button type="button" onclick="clearTexts()">クリア</button>
    <div class="Links">
        このツールはアルファベット、数字、一部の記号をモールス信号に変換します。<br>
        大文字/小文字は区別せず変換されます。<br>
        対応文字: A-Z, 0-9, . , ? /
    </div>
    <div class="footer">
        @Created by Yytanuki
    </div>
    <div class="footerLinks">
        <a href="https://x.com/TanukiYy">X(旧Twitter)</a>
        　
        <a href="https://youtube.com/@Yytanuki">YouTube</a>
    </div>

    <script>
        // モールス信号変換テーブル
        const morseCodeTable = {
            'A': '・ー',
            'B': 'ー・・・',
            'C': 'ー・ー・',
            'D': 'ー・・',
            'E': '・',
            'F': '・・ー・',
            'G': 'ーー・',
            'H': '・・・・',
            'I': '・・',
            'J': '・ーーー',
            'K': 'ー・ー',
            'L': '・ー・・',
            'M': 'ーー',
            'N': 'ー・',
            'O': 'ーーー',
            'P': '・ーー・',
            'Q': 'ーー・ー',
            'R': '・ー・',
            'S': '・・・',
            'T': 'ー',
            'U': '・・ー',
            'V': '・・・ー',
            'W': '・ーー',
            'X': 'ー・・ー',
            'Y': 'ー・ーー',
            'Z': 'ーー・・',
            '1': '・ーーーー',
            '2': '・・ーーー',
            '3': '・・・ーー',
            '4': '・・・・ー',
            '5': '・・・・・',
            '6': 'ー・・・・',
            '7': 'ーー・・・',
            '8': 'ーーー・・',
            '9': 'ーーーー・',
            '0': 'ーーーーー',
            '.': '・ー・ー・ー',
            ',': 'ーー・・ーー',
            '?': '・・ーー・・',
            '/': 'ー・・ー・',
            ' ': ' '
        };

        function convertToMorse() {
            // 入力値を取得
            const inputText = document.getElementById("inputText").value.toUpperCase();

            // エラーチェック
            if (!inputText) {
                alert("文を入力してください。");
                return;
            }

            // 変換を実行
            let result = '';
            for (let i = 0; i < inputText.length; i++) {
                const char = inputText[i];
                if (morseCodeTable[char] !== undefined) {
                    result += morseCodeTable[char] + ' ';
                } else if (char === ' ') {
                    result += ' / ';
                } else {
                    result += char + ' ';
                }
            }

            // 結果を表示
            document.getElementById("result").value = result.trim();
        }

        function copyResult() {
            const resultTextarea = document.getElementById("result");
            resultTextarea.select();
            document.execCommand("copy");
            alert("結果をコピーしました。");
        }

        function clearTexts() {
            document.getElementById("inputText").value = "";
            document.getElementById("result").value = "";
        }
    </script>
</body>
</html>
